[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grievancegrid-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1", "pillow>=11,<13", "boto3>=1.37,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
